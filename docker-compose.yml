services:
  atuin:
    restart: always
    image: ghcr.io/atuinsh/atuin:18.24.4
    command: start
    volumes:
      - "./config:/config"
    environment:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_OPEN_REGISTRATION: "true"
      ATUIN_DB_URI: postgres://${ATUIN_DB_USERNAME}:${ATUIN_DB_PASSWORD}@db/${ATUIN_DB_NAME}
      RUST_LOG: info,atuin_server=debug
    depends_on:
      - db
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "atuin"
      tsdproxy.port.1: "443/https:8888/http"
      observability.enable: "true"
      observability.service: "atuin"
    networks:
      - dokploy-network
      - default

  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - atuin-db:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${ATUIN_DB_USERNAME}
      POSTGRES_PASSWORD: ${ATUIN_DB_PASSWORD}
      POSTGRES_DB: ${ATUIN_DB_NAME}
      TZ: Europe/London
      PGTZ: Europe/London

volumes:
  atuin-db:

networks:
  dokploy-network:
    external: true
